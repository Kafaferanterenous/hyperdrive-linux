name: CI
# Linux-only project. DO NOT add macOS/Windows to the matrix:
# HyperDrive uses xdg-open, unix symlinks and Linux desktop semantics.
on:
  push:
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Linux deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - run: cargo fmt --check || true
      - run: cargo clippy -- -D warnings -A deprecated || true
      - run: cargo test
      - run: cargo build --release
